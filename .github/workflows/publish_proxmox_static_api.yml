name: Nordic Hub - Pubblica dati Proxmox

on:
  push:
    branches: [proxmox-static-api]
    paths:
      - 'static_api/**'
      - 'proxmox/validate_local_api.py'
      - '.github/workflows/publish_proxmox_static_api.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dati locali
        uses: actions/checkout@v4

      - name: Verifica API prima della pubblicazione
        run: python3 proxmox/validate_local_api.py static_api

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: static_api

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
