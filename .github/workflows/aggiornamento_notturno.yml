name: Nordic Hub - Scraper FISI

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scarica tutto lo storico FISI dal 2010'
        required: false
        default: false
        type: boolean
      season:
        description: 'Stagione FISI da testare (anno di inizio, es. 2026 = 2026/27)'
        required: false
        default: '2026'
        type: string
      committee:
        description: 'Comitato FISI da testare (slug, es. veneto; vuoto = tutti)'
        required: false
        default: 'veneto'
        type: string

jobs:
  scraper-fisi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CockroachDB CA certificate
        env:
          COCKROACH_CA_URL: ${{ secrets.COCKROACH_CA_URL }}
        run: |
          test -n "$COCKROACH_CA_URL" || (echo "COCKROACH_CA_URL secret mancante" && exit 1)
          mkdir -p "$HOME/.postgresql"
          curl --fail --silent --show-error --location "$COCKROACH_CA_URL" -o "$HOME/.postgresql/root.crt"
          chmod 600 "$HOME/.postgresql/root.crt"

      - name: Run FISI scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FISI_FULL_HISTORY: ${{ inputs.full_history && '1' || '0' }}
          FISI_START_SEASON: '2010'
          FISI_SEASONS: ${{ inputs.season || '' }}
          FISI_COMMITTEES: ${{ inputs.committee || '' }}
        run: python scraper_fisi.py
