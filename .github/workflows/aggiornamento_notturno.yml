name: Nordic Hub - Scraper FISI

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scarica tutto lo storico FISI dal 2010'
        required: false
        default: false
        type: boolean

jobs:
  scraper-fisi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FISI scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FISI_FULL_HISTORY: ${{ inputs.full_history && '1' || '0' }}
          FISI_START_SEASON: '2010'
        run: python scraper_fisi.py
