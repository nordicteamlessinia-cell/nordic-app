name: Bot Scraper FIS

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

jobs:
  aggiorna-database-fis:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Scarico il codice
        uses: actions/checkout@v4

      - name: Preparo Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installo le librerie e il Browser Fantasma
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: 🚀 Lancia lo Scraper FIS!
        run: python scraper_fis.py
