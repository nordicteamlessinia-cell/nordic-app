name: Nordic Hub - Scraper FIS

on:
  workflow_dispatch:

jobs:
  test-cockroach:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CockroachDB CA certificate
        env:
          COCKROACH_CA_URL: ${{ secrets.COCKROACH_CA_URL }}
        run: |
          test -n "$COCKROACH_CA_URL" || (echo "COCKROACH_CA_URL secret mancante" && exit 1)
          mkdir -p "$HOME/.postgresql"
          curl --fail --silent --show-error --location "$COCKROACH_CA_URL" -o "$HOME/.postgresql/root.crt"
          chmod 600 "$HOME/.postgresql/root.crt"

      - name: Test connection only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          from db import connect

          with connect() as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT current_user, current_database()")
                  user, database = cur.fetchone()
                  print(f"OK connessione: user={user} database={database}")

                  for table in ("Gare", "Risultati", "Risultati_Fis"):
                      cur.execute(f'SELECT count(*) FROM "{table}"')
                      print(f"{table}: {cur.fetchone()[0]} righe")
          PY
