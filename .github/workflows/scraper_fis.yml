name: Nordic Hub - Scraper FIS

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scarica tutto lo storico FIS dal 2010'
        required: false
        default: false
        type: boolean
      only_italians:
        description: 'Salva solo atleti italiani'
        required: false
        default: false
        type: boolean

jobs:
  scraper-fis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CockroachDB CA certificate
        env:
          COCKROACH_CA_URL: ${{ secrets.COCKROACH_CA_URL }}
        run: |
          test -n "$COCKROACH_CA_URL" || (echo "COCKROACH_CA_URL secret mancante" && exit 1)
          mkdir -p "$HOME/.postgresql"
          curl --fail --silent --show-error --location "$COCKROACH_CA_URL" -o "$HOME/.postgresql/root.crt"
          chmod 600 "$HOME/.postgresql/root.crt"

      - name: Run FIS scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIS_SEASONS: '2026'
          FIS_MAX_RACES: '3'
          FIS_FULL_HISTORY: '0'
          FIS_START_SEASON: '2010'
          FIS_ONLY_ITALIANS: '0'
        run: python scraper_fis.py
