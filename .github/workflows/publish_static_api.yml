name: Nordic Hub - Pubblica API Statica

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout cockroach-migration
        uses: actions/checkout@v6
        with:
          ref: cockroach-migration

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "psycopg[binary]"

      - name: Install CockroachDB CA certificate
        env:
          COCKROACH_CA_URL: ${{ secrets.COCKROACH_CA_URL }}
        run: |
          test -n "$COCKROACH_CA_URL" || (echo "COCKROACH_CA_URL secret mancante" && exit 1)
          mkdir -p "$HOME/.postgresql"
          curl --fail --silent --show-error --location "$COCKROACH_CA_URL" -o "$HOME/.postgresql/root.crt"
          chmod 600 "$HOME/.postgresql/root.crt"

      - name: Generate static JSON API
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STATIC_API_OUTPUT: static_api
        run: python export_static_api.py

      - name: Validate exported API
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("static_api")
          meta = json.loads((root / "v1/meta.json").read_text(encoding="utf-8"))

          if meta["athletes"] < 12000:
              raise SystemExit(f"ERRORE: troppo pochi atleti esportati: {meta['athletes']}")
          if meta["results"] < 190000:
              raise SystemExit(f"ERRORE: troppo pochi risultati esportati: {meta['results']}")
          if meta["skipped_results"] != 10:
              raise SystemExit(
                  f"ERRORE: record saltati inattesi: {meta['skipped_results']} (attesi 10 placeholder '-')"
              )

          print("✅ Export validato:", meta)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: static_api

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
