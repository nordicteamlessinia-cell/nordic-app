name: Nordic Hub - Test Storico FIS

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Stagione FIS da testare'
        required: false
        default: '2025'
        type: string

jobs:
  test-fis-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout cockroach-migration
        uses: actions/checkout@v4
        with:
          ref: cockroach-migration

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CockroachDB CA certificate
        env:
          COCKROACH_CA_URL: ${{ secrets.COCKROACH_CA_URL }}
        run: |
          test -n "$COCKROACH_CA_URL" || (echo "COCKROACH_CA_URL secret mancante" && exit 1)
          mkdir -p "$HOME/.postgresql"
          curl --fail --silent --show-error --location "$COCKROACH_CA_URL" -o "$HOME/.postgresql/root.crt"
          chmod 600 "$HOME/.postgresql/root.crt"

      - name: Test historical FIS discovery
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIS_SEASONS: ${{ inputs.season }}
          FIS_ONLY_ITALIANS: '0'
          FIS_DEBUG: '1'
          FIS_FORCE_REFRESH: '0'
          FIS_MAX_RACES: '5'
        run: python scraper_fis.py
