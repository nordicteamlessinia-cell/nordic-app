name: Nordic Hub - Diagnostico Dedup FISI FIS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout cockroach-migration
        uses: actions/checkout@v4
        with:
          ref: cockroach-migration

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "psycopg[binary]"

      - name: Install CockroachDB CA certificate
        env:
          COCKROACH_CA_URL: ${{ secrets.COCKROACH_CA_URL }}
        run: |
          mkdir -p "$HOME/.postgresql"
          curl --fail --silent --show-error --location "$COCKROACH_CA_URL" -o "$HOME/.postgresql/root.crt"
          chmod 600 "$HOME/.postgresql/root.crt"

      - name: Diagnose FISI/FIS overlap
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python diagnose_dedup_fisi_fis.py
